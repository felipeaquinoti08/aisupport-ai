# Agente de Suporte N1 - pilha local de IA (Ollama + Qdrant + ai-api)
#
# Orçamento de memória: 4 GB para o conjunto inteiro (soma dos mem_limit).
#   ollama  3456m  (medido: ~3,0 GB com LLM + embeddings carregados)
#   qdrant   320m  (medido: ~50 MB com KB pequena)
#   ai-api   320m  (medido: ~80 MB)
#
# Redes:
#   glpi_ai_net  interna, SEM saída para a Internet. Ollama e Qdrant vivem só aqui.
#   glpi_ai_edge com saída, usada apenas pela ai-api (precisa alcançar o GLPI)
#                e pelo serviço "model-puller" (download dos modelos).
#
# Uso:
#   docker compose up -d
#   docker compose --profile setup run --rm model-puller   # baixa os modelos

name: ${COMPOSE_PROJECT_NAME:-glpi-ai}

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  ollama:
    <<: *hardening
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.35.1}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_MAX_QUEUE: "${OLLAMA_MAX_QUEUE:-16}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:--1}"
      OLLAMA_CONTEXT_LENGTH: "${LLM_NUM_CTX:-4096}"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NOHISTORY: "1"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - glpi_ai_net
    mem_limit: ${OLLAMA_MEM_LIMIT:-3456m}
    memswap_limit: ${OLLAMA_MEM_LIMIT:-3456m}
    cpus: ${OLLAMA_CPUS:-4}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  qdrant:
    <<: *hardening
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.1-unprivileged}
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?defina QDRANT_API_KEY no .env}
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      QDRANT__LOG_LEVEL: WARN
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    networks:
      - glpi_ai_net
    mem_limit: ${QDRANT_MEM_LIMIT:-320m}
    memswap_limit: ${QDRANT_MEM_LIMIT:-320m}
    cpus: ${QDRANT_CPUS:-1}
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ai-api:
    <<: *hardening
    build:
      context: ./ai-api
    # Imagem construída a partir deste repositório (não existe em registro):
    # "docker compose pull" pula este serviço e "up" constrói no próprio
    # servidor (ARM64 ou x86). Necessário para Komodo/Portainer, que fazem pull antes do up.
    pull_policy: build
    image: ${COMPOSE_PROJECT_NAME:-glpi-ai}-ai-api:${AI_API_VERSION:-local}
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    ports:
      # Publicar SOMENTE no IP alcançável pelo servidor do GLPI (VPN, rede
      # privada) e restringir no firewall. Nunca 0.0.0.0 sem firewall.
      - "${AI_API_BIND:-127.0.0.1}:${AI_API_PORT:-8080}:8080"
    volumes:
      - ./certs:/certs:ro
    networks:
      - glpi_ai_net
      - glpi_ai_edge
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    mem_limit: ${AI_API_MEM_LIMIT:-320m}
    memswap_limit: ${AI_API_MEM_LIMIT:-320m}
    cpus: ${AI_API_CPUS:-1}
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL

  # Serviço de uso pontual: única instância do Ollama com acesso à Internet,
  # usada apenas para baixar modelos no volume compartilhado. O Ollama de
  # produção continua isolado na rede interna.
  model-puller:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.35.1}
    profiles: ["setup"]
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/pull-models.sh"]
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b-instruct-q4_K_M}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
      EXTRA_MODELS: ${EXTRA_MODELS:-}
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/pull-models.sh:/scripts/pull-models.sh:ro
    networks:
      - glpi_ai_edge

networks:
  glpi_ai_net:
    name: glpi_ai_net
    internal: true
  glpi_ai_edge:
    name: glpi_ai_edge

volumes:
  ollama_data:
  qdrant_data:
  qdrant_snapshots:
